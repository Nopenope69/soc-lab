# T4 plateau stress test (cycling within 30% to 70% SOC)
duty:
  cycle_type:
    value: "plateau_stress"
  initial_soc:
    value: 0.50
  soc_min_limit:
    value: 0.35
  soc_max_limit:
    value: 0.65
  rest_duration_s:
    value: 60.0
    reason: "short rest between plateau cycles to allow continuous reversal cycling within test duration"
  total_duration_s:
    value: 3600.0
