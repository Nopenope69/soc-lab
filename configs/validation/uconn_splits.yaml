      - "33"
      - "34"
      - "38"
      - "39"
      - "40"
      - "44"
      - "45"
      - "46"
      - "50"
      - "51"
      - "52"
      - "56"
      - "57"
      - "58"
      - "62"
      - "63"
    val_cells:
      # 11 cells (1 cell per group)
      - "05"
      - "11"
      - "17"
      - "23"
      - "29"
      - "35"
      - "41"
      - "47"
      - "53"
      - "59"
      - "64"

  # Sealed test partition (21 cells: 2 cells per group for groups 1-10, 1 cell for group 11)
  # EVALUATED ONCE ONLY AFTER SPEC IS FROZEN
  sealed_test_cells:
    - "06"
    - "07"
    - "12"
    - "13"
    - "18"
    - "19"
