# UConn REIL Dataset 5 Evaluation Splits
# Rule R3: Splits are strictly by CELL or by CONDITION. Sealed test sets must NEVER be accessed during tuning.
dataset_id: "uconn_reil_dataset5"
version: "1.0"

# -----------------------------------------------------------------------------
# Split 1: Cell-Held-Out Split (Within-condition generalization)
# -----------------------------------------------------------------------------
cell_holdout:
  split_policy: "BY_CELL"
  total_cells: 64

  # Development partition (43 cells total)
  dev_cells:
    train_cells:
      # 32 cells (3 cells per group for groups 1-10, 2 cells for group 11)
      - "02"
      - "03"
      - "04"
      - "08"
      - "09"
