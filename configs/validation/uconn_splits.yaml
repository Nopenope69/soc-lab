    - "65"

# -----------------------------------------------------------------------------
# Split 2: Condition-Held-Out Split (Cross-condition domain generalization)
# -----------------------------------------------------------------------------
condition_holdout:
  split_policy: "BY_CONDITION"
  dev_conditions:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 8
    - 9
    - 10
    - 11
  sealed_test_conditions:
    - 3  # High-rate rapid aging (cells 14-19)
    - 6  # Severe degradation regime (cells 32-37)
  sealed_test_cells:
    - "14"
    - "15"
    - "16"
    - "17"
    - "18"
