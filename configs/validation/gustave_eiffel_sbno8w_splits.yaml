# Gustave Eiffel Electrical model parameters of LFP 105Ah cells Splits (DOI 10.57745/SBNO8W)
# Rule R3: Splits are strictly by CELL. Sealed test set must NEVER be accessed during tuning.
dataset_id: "gustave_eiffel_sbno8w"
version: "1.0"
split_policy: "BY_CELL"

# Development partition
dev_cells:
  train_cells:
    - "BUGE388"
  val_cells:
    - "BUGE389"

# Sealed test partition (held-out test cells)
sealed_test_cells:
  - "BUGE390"
  - "BUGE391"

conditions:
  temperatures_c: [0, 10, 15, 20, 25, 30, 35, 40]
