# UConn REIL Dataset 5 Configuration and Hyperparameter Grid
# Rule R6: Provenance-tracked hyperparameters for SOH validation
dataset_id: "uconn_reil_dataset5"
cell_model: "LithiumWerks APR18650M1B"
cell_chemistry: "LFP/Graphite"
nominal_capacity_ah: 1.2
nominal_voltage_v: 3.3
cutoff_discharge_v: 2.0
cutoff_charge_v: 3.6

# Pulse segmentation and physical bounds
pulse:
  min_pulse_current_a: 0.20
  min_pulse_duration_s: 2.0
  min_relax_duration_s: 5.0
  current_step_threshold_a: 0.15
  step1_duration_s: 30.0
  step2_duration_s: 10.0
  relax_duration_s: 60.0
  soc_levels: [20.0, 50.0, 90.0]

# 2-RC ECM fitter constraints
ecm:
  max_cond_number: 100000.0
  max_fit_rmse_mv: 15.0

# Hyperparameter search grid on DEV partition
elastic_net:
  alpha_grid:
    - 0.001
    - 0.005
    - 0.01
    - 0.05
    - 0.1
    - 0.2
    - 0.5
    - 1.0
  l1_ratio_grid:
    - 0.1
    - 0.3
    - 0.5
    - 0.7
    - 0.9
    - 0.95

# Validation acceptance gates
acceptance_gates:
  soh_c_mae_held_out_max: 0.030
  soh_r_mae_held_out_max: 0.050
  beat_baseline_mae_ratio: 0.90
