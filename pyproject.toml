[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-lab"
version = "0.2.0+handover"
description = "State-of-Charge (SOC) Estimation Algorithm Lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TEC" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
research = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "matplotlib>=3.9.0",
    "h5py>=3.10.0",
]
ml = [
    "lightgbm>=4.0.0",
    "scikit-learn>=1.5.0",
]
neural = [
    "torch>=2.0.0",
]
soh = [
    "pybamm>=24.1.0",
]
all = [
    "pytest>=8.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "matplotlib>=3.9.0",
    "h5py>=3.10.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.5.0",
    "torch>=2.0.0",
    "pybamm>=24.1.0",
]

[project.scripts]
soc = "soc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
